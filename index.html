<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crystal Saga Nova Planner v2</title>
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
</head>
<body>
<div class="sidebar">
<div class="sidebar-footer">
  <a href="https://ko-fi.com/impostorshark" target="_blank">Support on Ko-fi</a>
</div>

<h2>Class</h2>
<select id="classSelect"></select>

<h2>Character Level</h2>
<input id="characterLevel" type="number" min="1" max="80" value="80">
<input id="characterRebirth" type="number" min="0" max="4" value="0">
<div id="skillPointsInfo" class="skill-points-info"></div>

<h2>Stats</h2>
PATK:<input id="patk" type="number" value="10" placeholder="PATK">
MATK:<input id="matk" type="number" value="10" placeholder="MATK">
PDEF:<input id="pdef" type="number" value="10" placeholder="PDEF">
MDEF:<input id="mdef" type="number" value="10" placeholder="MDEF">
HP:  <input id="hp" type="number" value="10" placeholder="HP">
Heal:<input id="heal" type="number" value="10" placeholder="Heal">
Attack Speed %:<input id="attackSpeed" type="number" value="100" placeholder="Attack Speed">
Cast Speed %:<input id="castSpeed" type="number" value="100" placeholder="Cast Speed">
Hit %:<input id="hitPercent" type="number" value="100" placeholder="Hit %">
Dodge:<input id="dodge" type="number" value="0" placeholder="Dodge">

<div class="share-block">
  <button id="shareBtn">Share Build</button>
  <input id="shareLink" type="text" readonly placeholder="Share link will appear here">
</div>
</div>

<div class="main">
  <div id="treeContainer"></div>
  <div class="summary">
    <h2>Calculated Stats</h2>
    <div id="summary"></div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
