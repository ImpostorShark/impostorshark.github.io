<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crystal Saga Nova Planner v2</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="sidebar">
<div class="sidebar-footer">
  <a href="https://ko-fi.com/impostorshark" target="_blank">Support on Ko-fi</a>
</div>

<h2>Class</h2>
<select id="classSelect"></select>

<h2>Character Level</h2>
<input id="characterLevel" type="number" min="1" max="80" value="80">
<div id="skillPointsInfo" class="skill-points-info"></div>

<h2>Stats</h2>
PATK:<input id="patk" type="number" value="10" placeholder="PATK">
MATK:<input id="matk" type="number" value="10" placeholder="MATK">
PDEF:<input id="pdef" type="number" value="10" placeholder="PDEF">
MDEF:<input id="mdef" type="number" value="10" placeholder="MDEF">
HP:  <input id="hp" type="number" value="10" placeholder="HP">
Heal:<input id="heal" type="number" value="10" placeholder="Heal">

</div>

<div class="main">
  <div id="treeContainer"></div>
  <div class="summary">
    <h2>Calculated Stats</h2>
    <div id="summary"></div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
